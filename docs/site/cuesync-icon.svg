<?xml version="1.0" encoding="UTF-8"?>
<!--
  cuesync-icon.svg / CueSync AR
  Vector master for the app icon. Single source of truth: every PNG under
  App/Resources/Assets.xcassets/AppIcon.appiconset is rendered from this
  file by Scripts/render-icon.sh. Edit here, never the PNGs.

  Concept: the projected aim line on green cloth. A cue ball (near, large)
  fires a cueAmber aim line at a ghost ball (outline, as the app draws it)
  tangent to a blue object ball. Four shapes, no text, no fine detail that
  has to survive at 40 px.

  Palette is the app's own (Packages/CueSyncUI/Sources/CueSyncUI/Theme.swift
  and TableSceneView.swift): cloth #1E6B45, aim line #F5A623 (cueAmber),
  object ball #4A90D9 (chalkBlue), cue ball #F5F2E9 (ballWhite).

  The dark / tinted appearance variants are the same drawing with the CSS in
  Design/appearances/*.css applied by rsvg-convert (user stylesheet). Every
  element that a variant needs to recolour carries an id or class.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Cloth: a lamp-lit felt, brightest just off-centre. -->
    <radialGradient id="cloth" cx="0.45" cy="0.40" r="0.85">
      <stop class="cloth-hi"  offset="0"   stop-color="#2E8F5E"/>
      <stop class="cloth-mid" offset="0.5" stop-color="#1E6B45"/>
      <stop class="cloth-lo"  offset="1"   stop-color="#10402A"/>
    </radialGradient>
    <radialGradient id="cueShade" cx="0.38" cy="0.32" r="0.75">
      <stop class="cue-hi"  offset="0"   stop-color="#FFFFFF"/>
      <stop class="cue-mid" offset="0.7" stop-color="#F5F2E9"/>
      <stop class="cue-lo"  offset="1"   stop-color="#C9C4B6"/>
    </radialGradient>
    <radialGradient id="objShade" cx="0.38" cy="0.32" r="0.75">
      <stop class="obj-hi"  offset="0"   stop-color="#7AB6EE"/>
      <stop class="obj-mid" offset="0.6" stop-color="#4A90D9"/>
      <stop class="obj-lo"  offset="1"   stop-color="#2A5FA3"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Cloth. Full-bleed: iOS applies its own rounded mask. -->
  <rect id="bg" width="1024" height="1024" fill="url(#cloth)"/>

  <!-- Aim line: cue-ball centre to ghost-ball centre. Soft glow under a solid core,
       matching the "thin rounded tube lying on the cloth, subtle glow" in 05-UX-DESIGN. -->
  <line id="aim-glow" x1="280" y1="740" x2="575" y2="447" stroke="#F5A623" stroke-width="150"
        stroke-linecap="round" opacity="0.4" filter="url(#glow)"/>
  <line id="aim" x1="280" y1="740" x2="575" y2="447" stroke="#F5A623" stroke-width="76"
        stroke-linecap="round"/>

  <!-- Ghost ball at the predicted contact point: outline only, as in the app. -->
  <circle id="ghost" cx="575" cy="447" r="130" fill="#FFFFFF" fill-opacity="0.12"
          stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="18"/>

  <!-- Object ball (the 2-ball, in the theme's chalkBlue), tangent to the ghost ball. -->
  <ellipse class="shadow" cx="780" cy="290" rx="135" ry="123" fill="#000000" opacity="0.38" filter="url(#shadow)"/>
  <circle id="object-ball" cx="760" cy="264" r="130" fill="url(#objShade)"/>

  <!-- Cue ball: nearest to the viewer, so the largest shape. -->
  <ellipse class="shadow" cx="302" cy="770" rx="176" ry="162" fill="#000000" opacity="0.38" filter="url(#shadow)"/>
  <circle id="cue-ball" cx="280" cy="740" r="170" fill="url(#cueShade)"/>
</svg>
