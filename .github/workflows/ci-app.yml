name: ci-app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-app:
    name: Build iOS app (Simulator)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain info
        run: |
          xcodebuild -version
          swift --version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project CueSyncAR.xcodeproj \
            -scheme CueSyncAR \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  test-packages-macos:
    name: Swift package tests (macOS)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Restore SwiftPM build cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: Packages/*/.build
          key: spm-macos-${{ hashFiles('Packages/*/Package.swift') }}
          restore-keys: spm-macos-
      - name: Test every package on the Apple toolchain
        run: |
          set -euo pipefail
          status=0
          for manifest in Packages/*/Package.swift; do
            pkg=$(dirname "$manifest")
            echo "::group::${pkg}"
            if ! swift test --package-path "$pkg"; then
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status
      - name: Save SwiftPM build cache (main only)
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: Packages/*/.build
          key: ${{ steps.cache.outputs.cache-primary-key }}

  detector-parity:
    name: Detector parity
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run the bundled Core ML model over committed keyframes (skeleton until Tools/DetectionEval and Fixtures land)
        run: |
          set -euo pipefail
          if [ -d Tools/DetectionEval ] && ls Fixtures/Sessions/*/keyframes/*.jpg >/dev/null 2>&1; then
            swift build --package-path Tools/DetectionEval -c release
            Tools/DetectionEval/.build/release/detection-eval --parity Fixtures/Sessions --min-match 0.9
          else
            echo "Detector parity skeleton: Tools/DetectionEval or fixture keyframes not present yet — passing by design."
          fi

  snapshot-tests:
    name: Snapshot tests (advisory)
    runs-on: macos-26
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Run snapshot suites where present
        run: |
          set -euo pipefail
          ran=0
          for pkg in Packages/CueSyncUI Packages/DisplayKit; do
            if grep -rq "Snapshot" "$pkg/Tests" 2>/dev/null; then
              swift test --package-path "$pkg" --filter Snapshot && ran=1
            fi
          done
          [ "$ran" = 1 ] || echo "No snapshot suites yet — advisory job passes by design."
