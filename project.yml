# XcodeGen project definition — the Xcode project is generated, not committed.
# Run Scripts/bootstrap.sh (or `xcodegen generate`) and open CueSyncAR.xcodeproj.
# Rationale: generated projects eliminate .pbxproj merge conflicts, which is
# essential for parallel agents (docs/roadmap/01-TECH-MODERNIZATION.md).
name: CueSyncAR
options:
  bundleIdPrefix: CQC
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"

packages:
  CueSyncCore:
    path: Packages/CueSyncCore
  BilliardsPhysics:
    path: Packages/BilliardsPhysics
  TableSpace:
    path: Packages/TableSpace
  PerceptionKit:
    path: Packages/PerceptionKit
  ARExperience:
    path: Packages/ARExperience
  DisplayKit:
    path: Packages/DisplayKit
  CueSyncUI:
    path: Packages/CueSyncUI
  CoachKit:
    path: Packages/CoachKit
  DetectionRoboflow:
    path: Packages/DetectionRoboflow
  CueSyncTestSupport:
    path: Packages/CueSyncTestSupport
  # Deterministic session replay (B2) + the bundle writer the on-device
  # session recorder streams into (SessionBundleRecorder, VideoFrameWriter).
  SessionReplay:
    path: Packages/SessionReplay

targets:
  CueSyncAR:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - App/Sources
      - App/Resources/Assets.xcassets
      # Core ML model must go through the SOURCES phase (Xcode compiles
      # .mlpackage -> .mlmodelc); a plain resource copy ships it uncompiled.
      - path: App/Resources/BallDetector.mlpackage
        buildPhase: sources
    dependencies:
      - package: CueSyncCore
      - package: BilliardsPhysics
      - package: TableSpace
      - package: PerceptionKit
      - package: ARExperience
      - package: DisplayKit
      - package: CueSyncUI
      - package: CoachKit
      - package: DetectionRoboflow
      - package: SessionReplay
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: CueSync AR
        # Not a splash screen with a logo: Apple's guidance is that a
        # launch screen should resemble the FIRST screen, and this app's
        # first screen is a live camera feed. An empty dict rendered a
        # white flash before a dark camera view; a dark ground matches
        # what actually appears next, and the icon is what identifies the
        # app before it opens.
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Why there is no NSBonjourServices alongside this: the key is
        # inert for a plain NWListener on a fixed port, which is what the
        # debug mirror is. Advertising the service would make iOS raise the
        # local-network prompt for real -- and a denial kills the listener
        # and surfaces as a start failure, taking the only remote debugging
        # channel with it. The string is here so that if the prompt ever
        # does appear, it says something true.
        NSLocalNetworkUsageDescription: >-
          CueSync AR can mirror its screen and tracking data to a browser on
          your own Wi-Fi, so you can watch the app while the device sits at
          the table. Nothing leaves your network.
        NSCameraUsageDescription: >-
          CueSync AR uses the camera to see the billiards table and balls so
          it can draw live shot guidance on top of them.
        UIRequiredDeviceCapabilities: [arkit]
        # Recorded session bundles (Documents/Sessions) show up in Files
        # and in Finder over a cable — the fallback when the Wi-Fi pull
        # (Scripts/pull-session.sh) is not an option.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Secrets surfaced from App/Config/Secrets.xcconfig (untracked).
        ROBOFLOW_API_KEY: $(ROBOFLOW_API_KEY)
    postBuildScripts:
      # Stamps the built Info.plist with the git SHA/branch/dirty flag the
      # build came from, so the HUD badge, the debug mirror and the startup
      # log can all name the running build. Runs before code signing.
      # The script can never fail a build — a checkout with no git history
      # (CI's shallow/detached clone) simply writes "unknown".
      - name: Embed Build Identity
        path: Scripts/embed-build-identity.sh
        # Nothing declarable to depend on: git state changes without any
        # tracked input changing, so this must run on every build.
        basedOnDependencyAnalysis: false
        # Ordering, not caching: naming the built Info.plist as an input is
        # what forces this phase to run AFTER ProcessInfoPlistFile. Without
        # it the build system is free to schedule the phase first and the
        # stamped keys are silently overwritten.
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        # Keep the build environment (absolute paths, user names) out of the
        # CI log — this is a public repository.
        showEnvVars: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: CQC.CueSync-AR
        DEVELOPMENT_TEAM: 8VQNRK6J32
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # NO, deliberately: the Embed Build Identity phase has to read the
        # repo's git state (denied: SRCROOT is unreadable under the script
        # sandbox) and stamp the built Info.plist (denied: the products dir
        # is unwritable). Neither can be expressed as a declared input or
        # output — `git` needs the whole .git tree, and the Info.plist is
        # already another task's output. The only script phase in this
        # project is that one, its source is reviewed in-repo
        # (Scripts/embed-build-identity.sh), and it neither writes to the
        # source tree nor reads anything outside it.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    configFiles:
      Debug: App/Config/App.xcconfig
      Release: App/Config/App.xcconfig
    scheme:
      # Naming the target here is what makes `xcodebuild build-for-testing`
      # produce a test bundle; without it .github/workflows/verify-sim.yml
      # finds no CueSyncARUITests and silently takes its degraded
      # launch-only branch, which is what it has always done.
      testTargets:
        - CueSyncARUITests
      gatherCoverageData: true

  CueSyncARUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - App/UITests
    dependencies:
      - target: CueSyncAR
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: CQC.CueSync-AR.uitests
        DEVELOPMENT_TEAM: 8VQNRK6J32
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: CueSyncAR
